name: Build Documentation

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/v1.3-RC1
    paths:
      - 'doc/asciidoc/**'
      - '.github/build/**'
      - '.github/workflows/build-docs.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
    - name: Check out repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas

    - name: Generate EPD documentation
      run: |
        cd .github/build
        python generate_html_report.py
        python generate_attribute_pages.py
        python generate_csv_from_adoc.py

    - name: Generate Schemadoc documentation
      run: |
        cd .github/build
        python generate_schemadoc_html_report.py
        python generate_schemadoc_attribute_pages.py

    - name: Copy static assets to doc folder
      run: |
        cp -r .github/build/css doc/
        cp -r .github/build/js doc/

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gitActions
        publish_dir: ./doc
        destination_dir: doc
        keep_files: true
