name: Create Branch Documentation

on:
  create:
    branches:
      - '**'
  workflow_dispatch:  

permissions:
  contents: write

jobs:
  convert_csv_and_update_readme:
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the new branch that was just created
      - name: Checkout new branch
        uses: actions/checkout@v2
        with:
          ref: ${{ github.event.ref }}

      # Step 2: Get the branch name
      - name: Get Branch Name
        id: vars
        run: |
          branch_name="${GITHUB_REF#refs/heads/}"
          echo "branch_name=$branch_name" >> $GITHUB_ENV

      # Step 3: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'

      # Step 4: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl

      # Step 4.5: Generate schemadoc attribute pages
      - name: Generate schemadoc attribute pages
        run: |
          cd .github/build
          python generate_schemadoc_attribute_pages.py

      # Step 5: Convert CSV to HTML
      - name: Convert CSV to HTML
        run: |
          html_output_dir="gitBranches/${{ github.ref_name }}/identifiers"
          
          mkdir -p "$html_output_dir"

          python - <<EOF
          import pandas as pd
          import os
          from openpyxl import load_workbook

          # Output directory based on branch name
          html_output_dir = "${html_output_dir}"
  

          # Define files and IDs
          files_with_ids = {
              "ecoinvent database: source data sets": "doc/identifiers/BackgroundDB_SourceDatasets_ecoinvent.csv",
              "GaBi database: source data sets": "doc/identifiers/BackgroundDB_SourceDatasets_GaBi.csv",
              "Common references": "doc/identifiers/Common_references.csv",
              "Country-specific indicators": "doc/identifiers/Country-specific_indicators.csv",
              "EN15804+A1 indicators": "doc/identifiers/EN15804+A1_indicators.csv",
              "EN15804+A2 (EF3.0) indicators": "doc/identifiers/EN15804+A2_EF3.0_indicators.csv",
              "EN15804+A2 (EF3.1) indicators": "doc/identifiers/EN15804+A2_EF3.1_indicators.csv",
              "Flow properties and unit groups": "doc/identifiers/Flow_properties_and_unit_groups.csv"
          }

          # Convert CSV to HTML
          for file_id, file_path in files_with_ids.items():
              if os.path.exists(file_path):
                  df = pd.read_csv(file_path)
                  html_table = df.to_html(index=False, classes='table table-striped', border=0, table_id=file_id)
                  html_filename = os.path.join(html_output_dir, os.path.basename(file_path).replace('.csv', '.html'))
                  with open(html_filename, 'w') as f:
                      f.write(f"""
                      <!DOCTYPE html>
                      <html>
                      <head>
                          <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
                          <title>{file_id}</title>
                      </head>
                      <body>
                          <div class="container">
                              <h1>{file_id}</h1>
                              {html_table}
                          </div>
                      </body>
                      </html>
                      """)


      # Step 6: Checkout the gitActions branch and create directories for schemadoc
      - name: Checkout gitActions branch
        uses: actions/checkout@v2
        with:
          ref: gitActions
          path: gitActions

      - name: Create directories for new branch outputs
        run: |
          mkdir -p "gitActions/gitBranches/${{ github.ref_name }}/schemadoc"

      - name: Copy required files to target directory
        run: |
          branch_name="${{ github.ref_name }}"
          cp -r "gitBranches/$branch_name/identifiers" "gitActions/gitBranches/$branch_name/"
          cp -r ./doc/schemadoc/* "gitActions/gitBranches/$branch_name/schemadoc/"

      # Step 7: Commit and push changes to gitActions branch
      - name: Commit and push changes to gitActions branch
        working-directory: gitActions
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "gitBranches/${{ github.ref_name }}"
          git commit -m "Converted CSV files and added schemadoc content for ${{ github.ref_name }}"
          git push origin gitActions

      # Step 8: Update README.md links for new branch
      - name: Update README links for new branch
        run: |
          branch_name="${{ github.ref_name }}"
          pages_url="${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"

          # Replace schemadoc URLs (handles branch names with slashes)
          sed -E -i 's|https://[^/]+\.github\.io/[^/]+/gitBranches/[^/]+(/[^/]+)?/schemadoc/|https://'"$pages_url"'/gitBranches/'"$branch_name"'/schemadoc/|g' README.md

          # Replace identifiers URLs (handles branch names with slashes)
          sed -E -i 's|https://[^/]+\.github\.io/[^/]+/gitBranches/[^/]+(/[^/]+)?/identifiers/|https://'"$pages_url"'/gitBranches/'"$branch_name"'/identifiers/|g' README.md

      # Step 9: Commit and push the updated README.md to the new branch
      - name: Commit and push updated README.md
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Added links to HTML documentation for ${{ github.ref_name }}"
          git push origin "${{ github.ref_name }}"
